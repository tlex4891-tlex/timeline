<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IT projekt – Timeline zakázky</title>
  <style>
    /* Responsive root font-size: scales with viewport width
       - 1920px (Full HD): ~16px (standard)
       - 2560px (QHD):     ~22px
       - 3840px (4K/UHD):  ~38px — readable on 75" panel from distance
       Capped at 42px to prevent oversizing on ultrawide screens */
    html {
      font-size: clamp(16px, 1vw, 42px);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 600;
      margin-bottom: 3rem;
      color: #f1f5f9;
      text-align: center;
      letter-spacing: 0.02em;
    }

    .timeline-wrapper {
      width: 100%;
      max-width: 68.75rem; /* 1100px at 16px, ~2640px at 4K */
      position: relative;
    }

    /* --- Milníky nad čárou --- */
    .milestones {
      display: flex;
      justify-content: space-between;
      position: relative;
      padding: 0 0.5rem;
    }

    .milestone {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      flex: 1;
      position: relative;
      z-index: 2;
    }

    .milestone-label {
      font-size: 0.72rem;
      font-weight: 600;
      text-align: center;
      padding: 0.4rem 0.3rem;
      border-radius: 6px;
      transition: color 0.25s, background 0.25s;
      line-height: 1.35;
      max-width: 110px;
      color: #94a3b8;
    }

    .milestone:hover .milestone-label,
    .milestone.active .milestone-label {
      color: #38bdf8;
    }

    .milestone-number {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 2.2rem;
      height: 2.2rem;
      border-radius: 50%;
      background: #1e293b;
      border: 0.16rem solid #334155;
      font-size: 0.85rem;
      font-weight: 700;
      color: #64748b;
      margin-top: 0.6rem;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      z-index: 3;
    }

    /* Předchozí fáze – jen modrý obrys */
    .milestone.passed .milestone-number {
      border-color: #38bdf8;
      color: #38bdf8;
      background: #1e293b;
    }

    .milestone.passed .milestone-label {
      color: #38bdf8;
    }

    /* Aktivní fáze – plný modrý kruh */
    .milestone:hover .milestone-number,
    .milestone.active .milestone-number {
      background: #0ea5e9;
      border-color: #38bdf8;
      color: #fff;
      box-shadow: 0 0 16px rgba(14, 165, 233, 0.45);
      transform: scale(1.15);
    }

    /* --- Horizontální čára --- */
    .timeline-line {
      position: relative;
      height: 0.25rem;
      background: #334155;
      border-radius: 0.125rem;
      margin: 0 calc(0.5rem + 1.1rem);
      margin-top: -1.1rem;
      z-index: 1;
    }

    .timeline-line::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: var(--progress, 0%);
      background: linear-gradient(90deg, #0ea5e9, #38bdf8);
      border-radius: 0.125rem;
      transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* --- Detail kontejner pod čárou --- */
    .detail-area {
      margin-top: 2.2rem;
      min-height: 11.25rem;
      display: flex;
      align-items: flex-start;
      justify-content: center;
    }

    .detail-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 0.75rem;
      padding: 1.5rem 2rem;
      max-width: 30rem; /* 480px at 16px, ~1152px at 4K */
      width: 100%;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.3s ease, transform 0.3s ease;
      pointer-events: none;
    }

    .detail-card.visible {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .detail-card h3 {
      font-size: 1rem;
      font-weight: 600;
      color: #38bdf8;
      margin-bottom: 0.8rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .detail-card h3 .num {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 1.5rem;
      height: 1.5rem;
      border-radius: 50%;
      background: #0ea5e9;
      color: #fff;
      font-size: 0.75rem;
      flex-shrink: 0;
    }

    .detail-card ul {
      list-style: none;
      padding: 0;
    }

    .detail-card ul li {
      position: relative;
      padding: 0.35rem 0 0.35rem 1.2rem;
      font-size: 0.88rem;
      color: #cbd5e1;
      line-height: 1.5;
    }

    .detail-card ul li::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0.75rem;
      width: 0.375rem;
      height: 0.375rem;
      border-radius: 50%;
      background: #0ea5e9;
    }

    /* --- Otázky v detailu --- */
    .detail-questions {
      margin-top: 1rem;
      padding-top: 0.8rem;
      border-top: 1px solid #334155;
    }

    .detail-questions h4 {
      font-size: 0.85rem;
      font-weight: 600;
      color: #f59e0b;
      margin-bottom: 0.5rem;
      font-style: italic;
    }

    .detail-questions ul {
      list-style: none;
      padding: 0;
    }

    .detail-questions ul li {
      position: relative;
      padding: 0.25rem 0;
      font-size: 0.82rem;
      color: #94a3b8;
      line-height: 1.5;
      font-style: italic;
    }

    .detail-questions ul li::before {
      content: none;
    }

    /* --- Instrukce --- */
    .hint {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.78rem;
      color: #475569;
      font-style: italic;
    }

    /* --- Responsive --- */
    @media (max-width: 768px) {
      .milestone-label {
        font-size: 0.62rem;
        max-width: 80px;
      }

      .milestone-number {
        width: 1.8rem;
        height: 1.8rem;
        font-size: 0.75rem;
      }

      .detail-card {
        padding: 1.2rem 1.4rem;
      }
    }

    @media (max-width: 500px) {
      .milestone-label {
        display: none;
      }

      .detail-card {
        max-width: 100%;
      }
    }
  </style>
</head>
<body>

  <h1>Cyklus IT obchodní zakázky / projektu</h1>

  <div class="timeline-wrapper">
    <div class="milestones" id="milestones"></div>
    <div class="timeline-line" id="timelineLine"></div>
    <div class="detail-area">
      <div class="detail-card" id="detailCard">
        <h3 id="detailTitle"></h3>
        <ul id="detailList"></ul>
        <div class="detail-questions" id="detailQuestions" style="display:none;">
          <h4>Otázky</h4>
          <ul id="detailQuestionsList"></ul>
        </div>
      </div>
    </div>
    <p class="hint">Najeďte myší nebo klikněte na milník pro zobrazení detailů</p>
  </div>

  <script>
    const data = [
      {
        title: 'Iniciace požadavku',
        items: [
          'Vznik business potřeby',
          'Sepsání požadavku (ticket, RFC, user story)',
          'Přiřazení priority a kategorie'
        ],
        questions: [
          'Kdo a jak iniciuje požadavky pro potřeby migrace/konfigurace?',
          'Kdo určuje priority těchto požadavků? (v CN je vždy uveden fixní časový horizont od objednání)'
        ]
      },
      {
        title: 'Schválení a posouzení',
        items: [
          'Review požadavku (product owner, manažer)',
          'Odhadování náročnosti',
          'Schválení financování / kapacit',
          'Zařazení do backlogu nebo sprintu'
        ],
        questions: [
          'Probíhá review požadavku se Synot Tech, případně se zákazníkem?',
          'Předáváme směrem na Synot Tech (zákazníka odhad náročnosti, je součástí finální CN)?',
          'Schvaluje si někdo interně a předává na ST info o kapacitách týmů a zařazení projektu v čase?',
          'Pokud ST objedná předáváme mu info termínu dodání celku?'
        ]
      },
      {
        title: 'Analýza a design',
        items: [
          'Funkční a technická analýza',
          'Návrh architektury / řešení',
          'Odsouhlasení specifikace (sign-off)'
        ],
        questions: [
          'Odsouhlasujeme / potvrzujeme si funkční a tech. analýzu/návrh architektury s ST? (abychom pokryli všechny potřeby)'
        ]
      },
      {
        title: 'Implementace',
        items: [
          'Zahájení implementace',
          'Konfigurace serverů, sítí, security',
          'Dokončení implementace'
        ]
      },
      {
        title: 'Testování (QA)',
        items: [
          'Unit testy / integrační testy',
          'Systémové testování (SIT)',
          'Uživatelské akceptační testování (UAT)',
          'Oprava defektů a regresní testy',
          'QA sign-off'
        ],
        questions: [
          'Testujeme společně s ST, nebo si testuje ST samo?',
          'Bývá součástí každé dodávky vždy i UAT prostředí?',
          'Pokud není UAT prostředí, nestálo by za to dohodnout se s našimi zákazníky alespoň na Staging environment?'
        ]
      },
      {
        title: 'Příprava na nasazení',
        items: [
          'Release planning',
          'Schválení releasu',
          'Go/No-Go rozhodnutí'
        ],
        questions: [
          'Kdo dává Go/No-Go rozhodnutí? (víme o přípravě přechodu do produkce předem?)'
        ]
      },
      {
        title: 'Nasazení',
        items: [
          'Nasazení do staging/pre-production prostředí',
          'Smoke testy po nasazení',
          'Nasazení do produkce (go-live)'
        ]
      },
      {
        title: 'Post-produkční stabilizace',
        items: [
          'Hypercare / monitoring po nasazení',
          'Řešení post-production incidentů',
          'Formální předání do provozu (handover)',
          'Uzavření ticketu / požadavku'
        ],
        questions: [
          'Řešíme my nebo ST předávací protokol podepsaný zákazníkem (Slovmatic apod.)?'
        ]
      }
    ];

    const milestonesEl = document.getElementById('milestones');
    const timelineLine = document.getElementById('timelineLine');
    const detailCard = document.getElementById('detailCard');
    const detailTitle = document.getElementById('detailTitle');
    const detailList = document.getElementById('detailList');

    let activeIndex = null;
    let isTouchDevice = false;

    data.forEach((milestone, i) => {
      const el = document.createElement('div');
      el.className = 'milestone';
      el.dataset.index = i;
      el.innerHTML = `
        <span class="milestone-label">${milestone.title}</span>
        <span class="milestone-number">${i + 1}</span>
      `;
      milestonesEl.appendChild(el);

      el.addEventListener('mouseenter', () => {
        if (!isTouchDevice) showDetail(i);
      });
      el.addEventListener('mouseleave', () => {
        if (!isTouchDevice) hideDetail();
      });
      el.addEventListener('click', () => toggleDetail(i));
      el.addEventListener('touchstart', () => { isTouchDevice = true; }, { passive: true });
    });

    /* Zavřít detail při tapnutí mimo milníky (mobil) */
    document.addEventListener('click', (e) => {
      if (isTouchDevice && activeIndex !== null && !e.target.closest('.milestone')) {
        hideDetail();
      }
    });

    function getProgressForIndex(index) {
      const circles = document.querySelectorAll('.milestone-number');
      const lineRect = timelineLine.getBoundingClientRect();
      const circleRect = circles[index].getBoundingClientRect();
      const circleCenterX = circleRect.left + circleRect.width / 2;
      const offset = circleCenterX - lineRect.left;
      const progress = Math.min(100, Math.max(0, (offset / lineRect.width) * 100));
      return progress;
    }

    const detailQuestions = document.getElementById('detailQuestions');
    const detailQuestionsList = document.getElementById('detailQuestionsList');

    function showDetail(index) {
      activeIndex = index;
      const m = data[index];

      detailTitle.innerHTML = `<span class="num">${index + 1}</span> ${m.title}`;
      detailList.innerHTML = m.items.map(item => `<li>${item}</li>`).join('');

      if (m.questions && m.questions.length > 0) {
        detailQuestionsList.innerHTML = m.questions.map(q => `<li>${q}</li>`).join('');
        detailQuestions.style.display = '';
      } else {
        detailQuestions.style.display = 'none';
      }

      detailCard.classList.add('visible');

      const progress = getProgressForIndex(index);
      timelineLine.style.setProperty('--progress', progress + '%');

      document.querySelectorAll('.milestone').forEach((el, i) => {
        el.classList.toggle('active', i === index);
        el.classList.toggle('passed', i < index);
      });
    }

    function hideDetail() {
      activeIndex = null;
      detailCard.classList.remove('visible');
      timelineLine.style.setProperty('--progress', '0%');
      document.querySelectorAll('.milestone').forEach(el => {
        el.classList.remove('active');
        el.classList.remove('passed');
      });
    }

    function toggleDetail(index) {
      if (activeIndex === index && detailCard.classList.contains('visible')) {
        hideDetail();
      } else {
        showDetail(index);
      }
    }
  </script>
</body>
</html>
